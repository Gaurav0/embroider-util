name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 18
          - 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Test (classic)
        run: yarn test:classic
      - name: Test (Embroider optimized)
        run: yarn test:ember

  try-scenarios:
    name: ${{ matrix.try-scenario }}
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    continue-on-error: ${{ matrix.try-scenario == 'ember-release' }}
    strategy:
      fail-fast: false
      matrix:
        try-scenario:
          - ember-lts-4.8
          - ember-lts-4.12
          - ember-lts-5.4
          - ember-lts-5.8
          - ember-release
          - embroider-safe
          - embroider-optimized
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn ember try:one ${{ matrix.try-scenario }} --- ember test --test-port=0

  # Install the packed package the way a consumer would (no resolutions, no
  # devDependencies) and fail on any moderate or higher advisory.
  consumer-audit:
    name: Consumer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Pack
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Install as a consumer
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer
          cd consumer
          echo '{"name":"consumer","private":true}' > package.json
          npm install --ignore-scripts --no-audit --legacy-peer-deps ../*.tgz
      - name: Audit (moderate and above)
        working-directory: ${{ runner.temp }}/consumer
        run: npm audit --audit-level=moderate
